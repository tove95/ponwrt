name: Build PonWrt (ZN504XG-D & HG5585F)

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to GitHub Releases'
        required: false
        default: 'true'
        type: boolean
  push:
    branches:
      - master
    paths:
      - 'configs/**'
      - 'files/**'
      - 'scripts/**'
      - '.github/workflows/build-zn504.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZN504XG-D & HG5585F
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-zn504-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-zn504-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare custom packages
        run: |
          bash ./scripts/customize.sh

      - name: Configure for ZN504XG-D
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config
          make defconfig

      - name: Download package sources
        run: make download -j"$(nproc)"

      - name: Compile firmware
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Organize output files
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f \( -name "*zn504*" -o -name "*hg5585f-ct*" \) ! -name "*usb-sfp*" \( -name "*sysupgrade.itb" -o -name "*recovery.itb" -o -name "*manifest" \) -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== Generated Firmware Artifacts ==="
          ls -lh
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-ZN504-HG5585F-enhanced-firmware
          path: output/*
          retention-days: 14

      - name: Generate release tag
        id: tag
        if: github.event.inputs.upload_release != 'false'
        run: |
          echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.upload_release != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt ZN504XG-D & HG5585F 电信版聚合增强固件 (${{ steps.tag.outputs.release_tag }})
          body: |
            ### PonWrt Airoha AN7581 聚合增强固件 (ZN504XG-D & HG5585F 电信版)
            * **适用机型**：
              - **烽火/中移 ZN504XG-D**：纯有线 2.5G 高性能光猫（AN7581 + EN8811H 2.5G 网口）
              - **烽火 HG5585F (CT 电信版)**：带 Wi-Fi 6 (MT7916D DBDC AX3000 + NPU WED 硬件加速，原生保留 USB 3.0 超高速接口)
            * **后台管理**：`192.168.1.1`（用户名: `root`，默认无密码）
            * **Wi-Fi 7 / 6 特性 (HG5585F)**：
              - 集成 MediaTek MT7916 驱动与 NPU WED 硬件加速固件 (`en7581_MT7916_npu_rv32.bin`)
              - 预置板载 factory 8192 偏移校准与 `07_an7581_bsp_wifi_mac` 独立 MAC 算号
              - 预置 `SingleSKU` 与 `mt7916-sku.dat` 射频功率校准表
            * **核心网络与实时音视频保序优化**：
              - 默认关闭 Flowtable 流卸载（`flow_offloading='0'`），彻底根治 Netfilter `nf_flowtable_udp_timeout=30s` 造成的微信视频/VoIP实时长连接周期性断流
              - 默认关闭多核 `packet_steering`，避免 AN7581 多核乱序导致实时 UDP/RTP 抖动
              - 预置 Momo 大陆 IP/IPv6 绝对直连旁路与 STUN 保障，保障国内流量零劫持
              - 网桥放行 LLDP (0x4000)，杜绝下挂 AP 组播心跳导致网桥丢包统计异常
              - 移植 QWRT 内存防碎片参数 (`vm.percpu_pagelist_high_fraction = 128`)，提升高通量多核并发页面分配效率
              - 移植 QWRT SSDP (`239.255.255.250:1900`) 与 WSD (`3702`) `NOTRACK` 局域网广播旁路，防止连接跟踪表与交换芯片 CDM 队列膨胀
              - 预置 16MB 万兆 TCP 读写套接字大缓冲区 (`rmem_max` / `wmem_max = 16M`)，彻底消除高带宽长肥管道瓶颈
              - 解锁 AN7581 4 核 1.2GHz 动态满频调频，停用未配置硬盘的闲置 Samba4/wsdd2 开箱净省近 50MB 内存
            * **集成 QWRT 核心硬件特性**：
              - Airoha AN7581 NPU / PPE 硬件流量转发加速 (`luci-app-airoha-npu`, `luci-app-hqos`)
              - CPU 调频策略与频率管理 (`luci-app-cpufreq`)
              - 磁盘与存储分区管理 (`luci-app-diskman`)
              - 网页终端 (`luci-app-ttyd`)
            * **第一性原理纯净加解密流水线**：
              - 遵循 ImmortalWrt 官方实践 (da63f7d)，彻底剔除 SafeXcel / EIP-93 协处理器 (`kmod-crypto-hw-eip93`)，杜绝 DMA 缓存颠簸与硬中断抢占，释放 4 核 NEON 极速运算 WireGuard (ChaCha20) 与 Momo 用户态代理
            * **精简纯净架构**：
              - 彻底移除冗余重型插件（Lucky、Samba4、集客AC、WOL、AutoReboot、UPnP、RAMFree），大幅减小固件体积并缩短编译时间
            * **集成 Kahen 项目精华**：
              - 修复 SoC 与光模块温度上报 (`temperature-rpc.uc` + `/sbin/tempinfo` RPC 联动)
              - MTD 读写支持 (`kmod-mtd-rw`)，保障工厂/校准分区备份
              - 响应式 Footstrap 主题与完整 LuCI 简体中文语言包
            * **集成 LeoooChen 项目精华**：
              - XG-PON 线路与 PPPoE 线速硬件流量卸载（千兆带宽 CPU 占用低至约 4.5%）
              - 8MB 高通量网络与 IPTV 环形缓冲区调优，杜绝 4K/8K 组播与突发丢包
            * **Momo / Sing-box 透明代理**：
              - 原生集成 `luci-app-momo` 与最新 `sing-box` 核心
              - 预置 128MiB 健康堆内存上限与定时内存整理防爆机制
              - 预置 Momo 完整简体中文汉化语言包
          files: output/*
