# 4K IPTV & High-Throughput Network Buffers (Airoha AN7581 / ZN504XG-D)
# UDP 核心缓冲区与内存池扩容（统一 16MB 上限，消灭 msd_lite / rtp2httpd / wi-fi 突发溢出丢包）
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 2097152
net.core.wmem_default = 2097152
net.ipv4.udp_mem = 16384 32768 65536
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.core.netdev_max_backlog = 10000

# 16MB TCP 读写缓冲区与 BBR 拥塞控制（与 30-network-buffers.conf 保持一致，避免热插拔覆盖回退）
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_congestion_control = bbr

# 桥接流量绕过 Netfilter（减轻高码率 25Mbps+ IPTV 组播流的 Conntrack 连接跟踪负担，消除 CPU 抖动）
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0

# ZRAM 与 512MB RAM 虚拟内存调度优化
vm.page-cluster = 0
vm.swappiness = 80
vm.vfs_cache_pressure = 100
vm.watermark_boost_factor = 0
